<title>Jérôme Eggli — Groupe Sidin Hotels</title>
<style>
:root{--fg:#555;--muted:#777;--line:#ddd;--bg:#f4f4f4;}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--fg);
display:flex;min-height:100vh;align-items:center;justify-content:center;padding:22px}
.card{width:min(430px,100%);background:white;border-radius:20px;padding:34px 28px 26px;
box-shadow:0 12px 40px rgba(0,0,0,.10);text-align:center}
.logo{width:280px;max-width:90%;margin:0 auto 30px}
h1{font-size:28px;font-weight:500;letter-spacing:.3px;margin:0 0 7px}
.role{font-size:16px;color:var(--muted);margin-bottom:5px}
.company{font-size:15px;color:var(--muted);margin-bottom:28px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
a.btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:10px 8px;
border:1px solid var(--line);border-radius:12px;color:#555;text-decoration:none;font-size:14px}
a.btn:hover{background:#f7f7f7}
.add{grid-column:1/-1;background:#555!important;color:white!important;border-color:#555!important;font-weight:600}
.details{margin:25px 0 16px;border-top:1px solid #eee;padding-top:20px;font-size:14px;line-height:1.8}
.details a{color:#555;text-decoration:none}
.qr{width:150px;height:150px;margin:10px auto 5px}
.small{font-size:11px;color:#999;margin-top:5px}
</style>
</head>
